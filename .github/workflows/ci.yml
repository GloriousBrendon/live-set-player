name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  # Manual trigger for verify-piper-sidecar (below): confirms the CMake target
  # name, CLI flags, and espeak-ng-data lookup against a real build, without
  # cutting a release tag.
  workflow_dispatch: {}

# Cancel superseded runs on the same branch, but never on a tag push (a release
# build should always run to completion).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # cpal's ALSA backend and midir (if ever added) both need `libasound2-dev`;
  # Tauri needs the rest. None of these are in Tauri's own prerequisite list.
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev
    libappindicator3-dev
    librsvg2-dev
    patchelf
    build-essential
    curl
    wget
    file
    libxdo-dev
    libssl-dev
    libasound2-dev
  # Pinned Piper sidecar source (docs/SPEC.md §8, src-tauri/binaries/README.md):
  # bumping this is a deliberate act, not an incidental one -- re-verify the CLI
  # still builds clean and re-check its flag surface before changing it.
  PIPER_COMMIT: f04d52c5528ac7cf2d73757f57990ff490f75005

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_DEPS }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Bare `cargo fmt --check` covers every workspace member. Bare `cargo
      # clippy`/`cargo test` do NOT -- this workspace has a root package
      # (lsp-scaffold) alongside the `engine` member, so without `--workspace`
      # both commands silently check/test only lsp-scaffold and skip lsp-engine
      # entirely, where all the real logic lives. `--workspace` is required for
      # this CI job to mean anything.
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace

  release:
    name: Release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Restrict bundle targets explicitly: tauri.conf.json's "all" would
          # also try `rpm` on Linux, which isn't installed on this runner and
          # isn't one of the two formats §14 asks for.
          - os: ubuntu-22.04
            bundles: appimage,deb
            target_triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            bundles: nsis
            target_triple: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_DEPS }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Built here, once per release, from the pinned commit -- never on the
      # `test` job above and never on a contributor's machine. This is the whole
      # point: `piper-rs` needed libclang + CMake on every `cargo build`; building
      # a standalone CLI ourselves confines that requirement to this one job,
      # which already has a full per-OS build environment for Tauri itself. Run
      # `workflow_dispatch`'s `verify-piper-sidecar` job below before trusting
      # this on a real release if the pinned commit has changed since it was last
      # verified (src-tauri/binaries/README.md).
      - name: Build Piper sidecar
        uses: ./.github/actions/build-piper-sidecar
        with:
          target-triple: ${{ matrix.target_triple }}
          piper-commit: ${{ env.PIPER_COMMIT }}

      # `externalBin`/`resources` are patched into tauri.conf.json here, not
      # committed statically: Tauri's build script validates those paths exist at
      # *every* `cargo build`, including a bare local one, not just at bundle
      # time -- committing them unconditionally would mean `cargo test --workspace`
      # fails on any machine without the sidecar binary already staged, which is
      # every dev machine (the whole reason it's a CI-only build, docs/SPEC.md §8).
      # `jq` ships preinstalled on both GitHub-hosted runner images used here.
      #
      # `externalBin` only bundles the one named sidecar binary -- it does not
      # sweep up the shared libraries verify-piper-sidecar proved piper-cli
      # actually needs at runtime (src-tauri/binaries/README.md's "Runtime
      # dependencies"), so those are added as `resources` here too, platform by
      # platform. **Confirmed on Windows** (phase-5, real `tauri build` + installed
      # NSIS package, 2026-08-14, src-tauri/binaries/README.md has the full
      # writeup): `externalBin` and `bundle.resources` land in the same directory
      # (`%LOCALAPPDATA%\lsp-scaffold\`, currentUser install mode), so
      # `current_exe().parent()` and `app.path().resource_dir()` agree and the DLLs
      # resolve via Windows' default same-directory search -- no fix needed.
      # **Confirmed on Linux AppImage too** (2026-08-16, real `tauri build
      # --bundles appimage` + the built .AppImage actually run, both on a real Linux
      # box -- full writeup in src-tauri/binaries/README.md): unlike Windows,
      # `externalBin` and `bundle.resources` do NOT land in the same directory here
      # -- `piper-cli` goes to `usr/bin/`, but `libpiper.so` and its onnxruntime
      # siblings (all `resources`, not `externalBin`) go to
      # `usr/lib/<productName>/`. A bare `$ORIGIN` rpath on `piper-cli` (this file's
      # old assumption) can never resolve that split and made `linuxdeploy` fail the
      # bundle outright with "Could not find dependency: libpiper.so", not just a
      # latent runtime bug. Fixed in
      # `.github/actions/build-piper-sidecar/action.yml`'s patchelf step with a
      # second rpath entry, `$ORIGIN/../lib/lsp-scaffold`, on `piper-cli` only
      # (`libpiper.so` itself stays flat with its onnxruntime siblings in every
      # layout, so its own `$ORIGIN` was already correct).
      - name: Wire the Piper sidecar into tauri.conf.json
        shell: bash
        working-directory: src-tauri
        run: |
          set -eu
          if [ "${{ runner.os }}" = "Windows" ]; then
            sidecar_libs='{
              "binaries/piper.dll": "piper.dll",
              "binaries/onnxruntime.dll": "onnxruntime.dll",
              "binaries/onnxruntime_providers_shared.dll": "onnxruntime_providers_shared.dll"
            }'
          else
            sidecar_libs='{
              "binaries/libpiper.so": "libpiper.so",
              "binaries/libonnxruntime.so": "libonnxruntime.so",
              "binaries/libonnxruntime.so.1": "libonnxruntime.so.1",
              "binaries/libonnxruntime.so.1.22.0": "libonnxruntime.so.1.22.0",
              "binaries/libonnxruntime_providers_shared.so": "libonnxruntime_providers_shared.so"
            }'
          fi
          jq --argjson extra "$sidecar_libs" '
            .bundle.externalBin = ["binaries/piper-cli"]
            | .bundle.resources = ({
                "resources/voices/": "resources/voices/",
                "resources/espeak-ng-data/": "resources/espeak-ng-data/",
                "resources/licenses/": "resources/licenses/"
              } + $extra)
          ' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Live Set Player ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

  # Manual-only (workflow_dispatch): builds just the Piper sidecar half of the
  # release job and actually *runs* the resulting binary against the bundled
  # voice, on both platforms, without cutting a release tag. This is what
  # confirms the CMake target name, the CLI flag surface, and the espeak-ng-data
  # lookup are real rather than the documented best-effort guess (§8,
  # src-tauri/binaries/README.md) -- the release job itself never proves the CLI
  # actually runs, only that `tauri build` bundled *something* under that name.
  verify-piper-sidecar:
    name: Verify Piper sidecar (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target_triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            target_triple: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_DEPS }}

      - name: Build Piper sidecar
        id: sidecar
        uses: ./.github/actions/build-piper-sidecar
        with:
          target-triple: ${{ matrix.target_triple }}
          piper-commit: ${{ env.PIPER_COMMIT }}

      - name: Render a short WAV and verify the CLI actually works
        shell: bash
        run: |
          set +e
          bin="${{ steps.sidecar.outputs.binary-path }}"
          chmod +x "$bin" 2>/dev/null

          {
            echo "## Piper CLI --help"
            echo '```'
            "$bin" --help
            echo "(exit status: $?)"
            echo '```'
          } | tee help_output.txt >> "$GITHUB_STEP_SUMMARY"

          echo "chorus" | "$bin" \
            --model "${{ steps.sidecar.outputs.voice-onnx-path }}" \
            --config "${{ steps.sidecar.outputs.voice-config-path }}" \
            --output_file out.wav \
            --length_scale 1.0 \
            --espeak_data "${{ steps.sidecar.outputs.espeak-data-path }}" \
            >render_stdout.txt 2>render_stderr.txt
          status=$?

          {
            echo "## Render invocation"
            echo "Flags: --model --config --output_file --length_scale --espeak_data (src-tauri/binaries/README.md's documented flags)"
            echo "Exit status: $status"
            echo '```'
            cat render_stdout.txt render_stderr.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- stdout ---"; cat render_stdout.txt
          echo "--- stderr ---"; cat render_stderr.txt
          echo "exit status: $status"

          if [ "$status" -ne 0 ]; then
            echo "::error::Piper CLI invocation failed (exit $status) with the flags documented in src-tauri/binaries/README.md -- read the --help output above (also in the job summary and the help_output.txt artifact) for the real flag names and correct tts.rs / the README from that, not from this guess."
            exit 1
          fi

          if [ ! -s out.wav ]; then
            echo "::error::out.wav is empty or missing despite exit 0"
            exit 1
          fi

          head_bytes=$(head -c 4 out.wav)
          wave_bytes=$(tail -c +9 out.wav | head -c 4)
          if [ "$head_bytes" != "RIFF" ] || [ "$wave_bytes" != "WAVE" ]; then
            echo "::error::out.wav does not have a valid RIFF/WAVE header (got '$head_bytes'/'$wave_bytes')"
            exit 1
          fi

          echo "OK: rendered a valid, non-empty WAV with the documented flags." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piper-sidecar-verify-${{ matrix.target_triple }}
          path: |
            help_output.txt
            render_stdout.txt
            render_stderr.txt
            out.wav
          if-no-files-found: ignore

      # The two artifacts above only prove the CLI runs *inside the CI runner's
      # flat build tree* -- they don't carry the actual staged binaries, so
      # there's no way to reproduce the still-open packaged-bundle question
      # (docs §4/src-tauri/binaries/README.md: does a real `tauri build` bundle
      # preserve the same relative layout?) outside of CI. Upload the staged
      # tree itself so it can be downloaded and dropped into a local checkout's
      # src-tauri/binaries + src-tauri/resources for exactly that check.
      - name: Upload staged sidecar binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piper-sidecar-staged-${{ matrix.target_triple }}
          path: |
            src-tauri/binaries
            src-tauri/resources/espeak-ng-data
            src-tauri/resources/voices
          if-no-files-found: ignore
