name: Build Piper sidecar
description: >
  Builds the libpiper CLI from the pinned OHF-Voice/piper1-gpl commit, stages it
  (plus espeak-ng-data) into src-tauri/binaries and src-tauri/resources, and fetches
  the bundled default voice model. Shared by the release job and the
  verify-piper-sidecar workflow_dispatch job (ci.yml) so there is exactly one place
  to correct the CMake target name / build layout, not two copies to keep in sync.

inputs:
  target-triple:
    description: Rust target triple used for the sidecar binary's filename suffix.
    required: true
  piper-commit:
    description: Pinned OHF-Voice/piper1-gpl commit to build.
    required: true

outputs:
  binary-path:
    description: Path to the staged Piper CLI binary.
    value: ${{ steps.stage.outputs.binary-path }}
  voice-onnx-path:
    description: Path to the fetched default voice .onnx file.
    value: ${{ steps.voice.outputs.onnx-path }}
  voice-config-path:
    description: Path to the fetched default voice .onnx.json file.
    value: ${{ steps.voice.outputs.config-path }}
  espeak-data-path:
    description: Path to the staged espeak-ng-data directory.
    value: ${{ steps.stage.outputs.espeak-data-path }}

runs:
  using: composite
  steps:
    - name: Checkout piper1-gpl (pinned)
      uses: actions/checkout@v4
      with:
        repository: OHF-Voice/piper1-gpl
        ref: ${{ inputs.piper-commit }}
        path: piper1-gpl

    # Verified against a real build (verify-piper-sidecar workflow_dispatch run,
    # 2026-08-14, both platforms -- see src-tauri/binaries/README.md):
    #
    # - The repo ROOT CMakeLists.txt is a different build graph entirely (the
    #   Python module `espeakbridge`, for scikit-build); it has no `piper` target
    #   at all, which is what made the first attempt fail with "No rule to make
    #   target 'piper'". The CLI lives in the `libpiper/` subdirectory's own,
    #   separate CMake project -- configure *that* directory, not the repo root.
    # - Inside libpiper/CMakeLists.txt, `piper` names the shared *library*
    #   (`add_library(piper SHARED ...)`). The CLI executable, built via
    #   `add_subdirectory(src/main)`, is a distinct target: `piper_exe`
    #   (libpiper/src/main/CMakeLists.txt: `add_executable(piper_exe main.cpp)`).
    # - This is a real build, not a trivial one: it downloads a prebuilt
    #   onnxruntime release and builds espeak-ng from source via
    #   `ExternalProject_Add`, so budget real minutes for it, not seconds.
    # - `libpiper/CMakeLists.txt` installs the shared library with
    #   `install(TARGETS piper DESTINATION ${CMAKE_INSTALL_PREFIX})` -- note: no
    #   RUNTIME/LIBRARY/ARCHIVE keyword, and `${CMAKE_INSTALL_PREFIX}` is resolved
    #   at *configure* time, not at `cmake --install --prefix` time. Left at its
    #   default it resolves to `/usr/local` (Linux) or `C:/Program Files/...`
    #   (Windows), and installing there without elevation fails with "Permission
    #   denied" -- confirmed the hard way. Passing `-DCMAKE_INSTALL_PREFIX` at
    #   *configure* time (not just `--install --prefix` at install time) is what
    #   actually controls this rule.
    # - `piper_exe` dynamically links `libpiper.so`/`piper.dll` -- it will not run
    #   standing alone. The library lands directly at the install prefix root
    #   (not under `bin/`, since that install rule has no RUNTIME subdirectory),
    #   so it's copied next to the staged executable below: `$ORIGIN` rpath on
    #   Linux (`patchelf`, already installed for Tauri's own AppImage bundling)
    #   makes the exe find it there with no environment variable needed; Windows'
    #   default DLL search order already checks the executable's own directory.
    - name: Build libpiper CLI
      shell: bash
      run: |
        set -eu
        install_prefix="$PWD/piper1-gpl/install"
        cmake -S piper1-gpl/libpiper -B piper1-gpl/build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$install_prefix"
        cmake --build piper1-gpl/build --config Release --target piper_exe
        cmake --install piper1-gpl/build --config Release

    - name: Stage Piper sidecar binary and espeak-ng-data
      id: stage
      shell: bash
      run: |
        set -eu
        mkdir -p src-tauri/binaries src-tauri/resources
        suffix=""
        libname="libpiper.so"
        if [ "${{ runner.os }}" = "Windows" ]; then
          suffix=".exe"
          libname="piper.dll"
        fi
        built="piper1-gpl/install/bin/piper_exe${suffix}"
        if [ ! -f "$built" ]; then
          echo "::error::$built not found after 'cmake --install' -- check libpiper/CMakeLists.txt's RUNTIME DESTINATION against the pinned commit" >&2
          exit 1
        fi
        lib="piper1-gpl/install/${libname}"
        if [ ! -f "$lib" ]; then
          echo "::error::$lib not found after 'cmake --install' -- piper_exe dynamically links it and won't run without it; check libpiper/CMakeLists.txt's 'install(TARGETS piper ...)' rule against the pinned commit" >&2
          exit 1
        fi
        dest="src-tauri/binaries/piper-cli-${{ inputs.target-triple }}${suffix}"
        cp "$built" "$dest"
        # The shared library sits next to the exe, not renamed -- Windows finds it
        # there by default DLL search order; Linux needs an explicit rpath, since
        # piper_exe's own build didn't set one (confirmed: "Set ... runtime path
        # of piper_exe to ''" in the build log).
        cp "$lib" "src-tauri/binaries/${libname}"

        # libpiper.so/piper.dll itself dynamically links onnxruntime -- confirmed
        # the hard way (exit 127, "libonnxruntime.so.1: cannot open shared object
        # file"). It installs correctly to <prefix>/lib/ (that install rule uses a
        # proper relative CMAKE_INSTALL_LIBDIR, unlike the buggy one for `piper`
        # above), so stage everything from there next to the other binaries too.
        ort_glob="piper1-gpl/install/lib/*.so*"
        if [ "${{ runner.os }}" = "Windows" ]; then ort_glob="piper1-gpl/install/lib/*.dll"; fi
        ort_found=0
        for f in $ort_glob; do
          [ -f "$f" ] || continue
          cp -P "$f" "src-tauri/binaries/$(basename "$f")"
          ort_found=1
        done
        if [ "$ort_found" -eq 0 ]; then
          echo "::error::no onnxruntime runtime library found under piper1-gpl/install/lib (glob: $ort_glob) -- piper_exe/libpiper depend on it at runtime; check libpiper/CMakeLists.txt's onnxruntime install rule against the pinned commit" >&2
          exit 1
        fi

        if [ "${{ runner.os }}" != "Windows" ]; then
          # $ORIGIN alone is correct for libname (it and its onnxruntime sibling
          # always land in the same directory as each other, flat, in every layout
          # this project produces) but not for $dest: confirmed against a real
          # `tauri build --bundles appimage` (2026-08-16) that Tauri's AppImage
          # bundler does NOT put externalBin and resources in the same directory
          # the way the NSIS bundler does (src-tauri/binaries/README.md's "Confirmed
          # against a real packaged bundle" section has the full writeup) --
          # `piper-cli` lands at `usr/bin/piper-cli` but `libpiper.so` (a `resources`
          # entry, not `externalBin`) lands at `usr/lib/<productName>/libpiper.so`.
          # A bare `$ORIGIN` rpath on piper-cli therefore looks in `usr/bin/`, where
          # the library never is, in the AppImage build specifically -- this made
          # `linuxdeploy` fail outright with "Could not find dependency: libpiper.so"
          # before the second rpath entry below was added, not just a silent
          # runtime failure. The second entry is relative to `usr/bin/`, hardcoded
          # to tauri.conf.json's `productName` ("lsp-scaffold") since nothing here
          # reads that file; keep the two in sync if productName ever changes. Both
          # $dest's flat verify-piper-sidecar layout (this same rpath's first entry)
          # and the Windows NSIS layout (no rpath involved) are unaffected.
          patchelf --set-rpath '$ORIGIN:$ORIGIN/../lib/lsp-scaffold' "$dest"
          patchelf --set-rpath '$ORIGIN' "src-tauri/binaries/${libname}"
        fi
        data_dir="piper1-gpl/install/espeak-ng-data"
        if [ ! -d "$data_dir" ]; then
          echo "::error::$data_dir not found after 'cmake --install' -- check libpiper/CMakeLists.txt's espeak-ng-data install rule against the pinned commit" >&2
          exit 1
        fi
        cp -r "$data_dir" src-tauri/resources/espeak-ng-data
        echo "binary-path=$dest" >> "$GITHUB_OUTPUT"
        echo "espeak-data-path=src-tauri/resources/espeak-ng-data" >> "$GITHUB_OUTPUT"

    - name: Fetch bundled default voice
      id: voice
      shell: bash
      run: |
        set -eu
        mkdir -p src-tauri/resources/voices
        base="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium"
        onnx="src-tauri/resources/voices/en_US-lessac-medium.onnx"
        cfg="src-tauri/resources/voices/en_US-lessac-medium.onnx.json"
        curl -fL -o "$onnx" "$base/en_US-lessac-medium.onnx"
        curl -fL -o "$cfg" "$base/en_US-lessac-medium.onnx.json"
        # Byte-count sanity check (src-tauri/resources/voices/README.md) -- a
        # truncated download must fail the build, not ship a voice that fails to
        # load silently at first use.
        size=$(wc -c < "$onnx")
        if [ "$size" -ne 63201294 ]; then
          echo "::error::en_US-lessac-medium.onnx is $size bytes, expected 63201294 -- download truncated or upstream file changed" >&2
          exit 1
        fi
        echo "onnx-path=$onnx" >> "$GITHUB_OUTPUT"
        echo "config-path=$cfg" >> "$GITHUB_OUTPUT"
