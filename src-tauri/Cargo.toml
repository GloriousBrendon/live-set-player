[workspace]
members = ["engine"]
# The app crate below (lsp-scaffold) is the default workspace member. It does not
# depend on lsp-engine yet -- that wiring happens in phase 2, when the Tauri layer
# starts driving the audio engine. Phase 1 only needs `engine` buildable and testable
# on its own: `cargo test -p lsp-engine`.

[package]
name = "lsp-scaffold"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lsp_scaffold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

