[package]
name = "lsp-engine"
version = "0.1.0"
description = "Live Set Player audio timeline, project model, and offline renderer. No Tauri dependency -- unit testable and drivable headlessly."
authors = ["you"]
edition = "2021"

# CLAUDE.md: "The audio engine is a standalone library crate with no Tauri dependency,
# so it can be unit tested and driven headlessly by the offline renderer." Do not add
# a tauri dependency here, ever -- that is what makes this crate testable in ~1s instead
# of pulling in the whole app.

[lib]
name = "lsp_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
thiserror = "2"
# Real-time layer (phase 2). cpal's optional `audio_thread_priority` feature is
# deliberately NOT enabled: it would register the WASAPI callback thread with MMCSS
# under the "Audio" task class, and a thread can only belong to one MMCSS task -- we
# register "Pro Audio" (a higher scheduling category) ourselves in `device::mmcss`.
cpal = "0.17"
rtrb = "0.3"
rubato = "0.16"
# Content-hash cache key for rendered cues (§8: cache by (text, voice_id, speed)).
sha2 = "0.10"
# MIDI control input (§9): device enumeration + input connection, mirroring cpal's
# role for the output side. No feature flags enabled -- no JACK/WinRT/CoreMIDI
# timestamping needed for a plain note-on/CC/program-change footswitch.
midir = "0.11"

[dev-dependencies]
